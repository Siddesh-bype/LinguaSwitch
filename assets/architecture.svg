<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7ad0ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="400" rx="12" fill="#0e1015"/>
  <rect x="1" y="1" width="858" height="398" rx="11" fill="none" stroke="#333a45" stroke-width="1"/>

  <text x="24" y="34" font-size="16" font-weight="bold" fill="#e7eaf0">DataForge — Hinglish TTS: native vs segment-and-route</text>
  <text x="24" y="54" font-size="12" fill="#9aa3b2">measured 2026-09-10 · 10 sentences · Rime Coda + Groq gpt-oss-20b</text>

  <!-- input -->
  <rect x="24" y="150" width="180" height="90" rx="8" fill="#1b1e27" stroke="#6b7280"/>
  <text x="38" y="176" font-size="12" font-weight="bold" fill="#e7eaf0">Hinglish text</text>
  <text x="38" y="196" font-size="11" fill="#9aa3b2">“Mera order kahan hai,</text>
  <text x="38" y="212" font-size="11" fill="#9aa3b2">can you check…?”</text>

  <!-- Path A -->
  <rect x="300" y="80" width="300" height="90" rx="8" fill="#12331f" stroke="#3fb96b"/>
  <text x="314" y="106" font-size="12" font-weight="bold" fill="#7dffa8">Path A — native (1 call)</text>
  <text x="314" y="126" font-size="11" fill="#9aa3b2">single Rime Coda call,</text>
  <text x="314" y="142" font-size="11" fill="#9aa3b2">model code-switches itself</text>
  <rect x="648" y="80" width="188" height="90" rx="8" fill="#1b1e27" stroke="#3fb96b"/>
  <text x="662" y="106" font-size="12" font-weight="bold" fill="#7dffa8">audio A</text>
  <text x="662" y="126" font-size="11" fill="#9aa3b2">avg total 2449 ms</text>
  <text x="662" y="142" font-size="11" fill="#9aa3b2">avg TTFA 1234 ms</text>

  <!-- Path B -->
  <rect x="300" y="230" width="300" height="90" rx="8" fill="#3d2f14" stroke="#a37c2e"/>
  <text x="314" y="256" font-size="12" font-weight="bold" fill="#ffd27a">Path B — routed (N+1 calls)</text>
  <text x="314" y="276" font-size="11" fill="#9aa3b2">gpt-oss-20b segments → N Rime</text>
  <text x="314" y="292" font-size="11" fill="#9aa3b2">calls, one voice per lang</text>
  <rect x="648" y="230" width="188" height="90" rx="8" fill="#1b1e27" stroke="#a37c2e"/>
  <text x="662" y="256" font-size="12" font-weight="bold" fill="#ffd27a">audio B</text>
  <text x="662" y="276" font-size="11" fill="#9aa3b2">avg total 5523 ms</text>
  <text x="662" y="292" font-size="11" fill="#9aa3b2">avg TTFA 2521 ms</text>

  <!-- connectors -->
  <path d="M 204 175 L 292 125" stroke="#7ad0ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="22" to="0" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <path d="M 204 215 L 292 265" stroke="#7ad0ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="22" to="0" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <path d="M 600 125 L 640 125" stroke="#3fb96b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 275 L 640 275" stroke="#a37c2e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- travelling packets -->
  <circle r="4" fill="#7dffa8">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 204 175 L 292 125 L 600 125 L 640 125"/>
  </circle>
  <circle r="4" fill="#ffd27a">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 204 215 L 292 265 L 600 275 L 640 275"/>
  </circle>

  <text x="24" y="362" font-size="13" font-weight="bold" fill="#e7eaf0">Result: native is ≈2.3× faster end-to-end · naturalness verdict: blind rating pending</text>
  <text x="24" y="382" font-size="11" fill="#9aa3b2">claim + reproduce procedure in RIME_EVIDENCE.md</text>
</svg>
