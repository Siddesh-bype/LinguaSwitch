services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Provider keys (empty = mock mode or honest 502s; see .env.example).
      - RIME_API_KEY=${RIME_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Set 1 for offline UI dev without provider keys (synthetic audio).
      - MOCK_TTS=${MOCK_TTS:-0}
      - MOCK_SEGMENTER=${MOCK_SEGMENTER:-0}
    volumes:
      # Persist eval clips/timings on the host (gitignored).
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    depends_on:
      - backend
